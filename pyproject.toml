[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill_state"
version = "0.2.0"
description = "SKILL.state runtime (independent reference implementation) plus the book's harness extensions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
harness = ["pyyaml>=6", "pydantic>=2", "pandas>=2", "numpy>=1.24"]
openrouter = ["openai>=1.40"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["skill_state*"]
